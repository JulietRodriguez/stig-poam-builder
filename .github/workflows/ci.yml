name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # NIST OSCAL v1.1.2 POA&M JSON Schema, pinned by SHA-256 so a changed file fails the build.
  OSCAL_SCHEMA_URL: https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_poam_schema.json
  OSCAL_SCHEMA_SHA256: 906725163d767036c6189aec51252109b203214e121fc1acaff494b4d2dfbc04

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download OSCAL POA&M schema
        run: |
          mkdir -p schemas
          curl -sSfL "$OSCAL_SCHEMA_URL" -o schemas/oscal_poam_schema.json
          echo "$OSCAL_SCHEMA_SHA256  schemas/oscal_poam_schema.json" | sha256sum -c -
      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  oscal-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download OSCAL POA&M schema
        run: |
          mkdir -p schemas
          curl -sSfL "$OSCAL_SCHEMA_URL" -o schemas/oscal_poam_schema.json
          echo "$OSCAL_SCHEMA_SHA256  schemas/oscal_poam_schema.json" | sha256sum -c -
      - name: Build POA&M from the synthetic samples
        run: |
          stig-poam build samples/inputs \
            --cci-list samples/cci/U_CCI_List_SAMPLE.xml \
            --system "Demo System (synthetic)" --out out
      - name: Validate OSCAL output against the official schema
        run: python tools/validate_oscal.py --schema schemas/oscal_poam_schema.json out/*.oscal.json
      - uses: actions/upload-artifact@v4
        with:
          name: sample-poam-outputs
          path: out/

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,dashboard]"
      - name: Run the Streamlit app headlessly (AppTest)
        run: pytest tests/test_dashboard.py -v
